<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML 加強訓練題｜互動解題網站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --text-muted: #8b9bb4;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.12);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.12);
      --radius: 14px;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      --font: "Noto Sans TC", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(34, 197, 94, 0.08) 0%, transparent 50%);
    }

    .app { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-top: 4px; }

    .score-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      text-align: center;
      min-width: 110px;
    }

    .score-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .score-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .progress-container { margin-bottom: 28px; position: relative; }

    .progress-bar {
      height: 6px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar::after {
      content: "";
      position: absolute;
      left: 0; top: 0;
      height: 100%;
      width: var(--progress, 10%);
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    .progress-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: right;
    }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px 24px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-meta {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .question-number {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .question-type {
      background: rgba(139, 155, 180, 0.15);
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.5;
      color: var(--text);
    }

    .question-body {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 22px;
      line-height: 1.7;
    }

    .question-body code,
    .question-body .code-block {
      font-family: var(--mono);
      font-size: 0.88rem;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px 6px;
      color: #e6edf3;
    }

    .question-body .code-block {
      display: block;
      padding: 14px 16px;
      margin: 12px 0;
      overflow-x: auto;
      white-space: pre-wrap;
      line-height: 1.55;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      width: 100%;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .option:hover:not(:disabled) {
      border-color: #4b6a9e;
      background: #2a3a52;
    }

    .option:disabled { cursor: default; }

    .option .opt-letter {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .option.selected {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.12);
    }

    .option.correct {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .option.correct .opt-letter {
      background: var(--success);
      color: #fff;
    }

    .option.wrong {
      border-color: var(--error);
      background: var(--error-bg);
    }

    .option.wrong .opt-letter {
      background: var(--error);
      color: #fff;
    }

    .feedback {
      margin-bottom: 22px;
      border-radius: 10px;
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }

    .feedback-result {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .feedback-result.correct {
      background: var(--success-bg);
      color: var(--success);
    }

    .feedback-result.wrong {
      background: var(--error-bg);
      color: var(--error);
    }

    .feedback-explain {
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.25);
      font-size: 0.92rem;
      line-height: 1.7;
      color: #c9d4e4;
    }

    .feedback-explain strong { color: #e7ecf3; }

    .feedback-explain code {
      font-family: var(--mono);
      font-size: 0.85rem;
      background: #0d1117;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .btn {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 10px 22px;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) { background: #2f3f56; }

    .result-screen {
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      text-align: center;
      box-shadow: var(--shadow);
      max-width: 420px;
      width: 100%;
      animation: fadeIn 0.4s ease;
    }

    .result-emoji { font-size: 3.2rem; margin-bottom: 12px; }
    .result-card h2 { font-size: 1.5rem; margin-bottom: 8px; }
    .result-score { font-size: 1.15rem; color: var(--text-muted); margin-bottom: 8px; }
    .result-score strong { color: var(--primary); font-size: 1.4rem; }
    .result-message { color: var(--text-muted); margin-bottom: 28px; font-size: 0.95rem; }

    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    @media (max-width: 560px) {
      .app { padding: 16px 14px 40px; }
      .header h1 { font-size: 1.4rem; }
      .question-card { padding: 20px 16px 18px; }
      .option { padding: 12px 14px; font-size: 0.9rem; }
      .nav-buttons { flex-direction: column-reverse; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-content">
        <h1>HTML 加強訓練題</h1>
        <p class="subtitle">第一組（共 10 題）｜互動解題練習</p>
      </div>
      <div class="score-box">
        <div class="score-label">目前得分</div>
        <div class="score-value"><span id="score">0</span> / <span id="total">10</span></div>
      </div>
    </header>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
      <div class="progress-text" id="progressText">第 1 / 10 題</div>
    </div>

    <main class="quiz-container">
      <div class="question-card" id="questionCard">
        <div class="question-meta">
          <span class="question-number" id="qNumber">第 1 題</span>
          <span class="question-type" id="qType">觀念題</span>
        </div>
        <h2 class="question-title" id="qTitle"></h2>
        <div class="question-body" id="qBody"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback" hidden>
          <div class="feedback-result" id="feedbackResult"></div>
          <div class="feedback-explain" id="feedbackExplain"></div>
        </div>
        <div class="nav-buttons">
          <button class="btn btn-secondary" id="prevBtn" disabled>上一題</button>
          <button class="btn btn-primary" id="nextBtn" disabled>下一題</button>
        </div>
      </div>
    </main>

    <section class="result-screen" id="resultScreen" hidden>
      <div class="result-card">
        <div class="result-emoji" id="resultEmoji">🎉</div>
        <h2 id="resultTitle">練習完成！</h2>
        <p class="result-score">你的得分：<strong id="finalScore">0</strong> / 10</p>
        <p class="result-message" id="resultMessage"></p>
        <div class="result-actions">
          <button class="btn btn-primary" id="restartBtn">再挑戰一次</button>
          <button class="btn btn-secondary" id="reviewBtn">回顧題目</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>用 VS Code + Live Server 開啟即可練習 · 純前端實作</p>
    </footer>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        type: "觀念題",
        title: "網頁三層架構分工",
        body: "在網頁開發的三層架構（HTML、CSS、JavaScript）中，下列哪一個敘述最符合 HTML 的核心職責？",
        options: [
          { key: "A", text: "負責處理按鈕點擊後的抽籤與資料累加邏輯" },
          { key: "B", text: "負責設定文字顏色、卡片圓角與背景漸層樣式" },
          { key: "C", text: "負責定義網頁的結構與內容（例如「這裡有一個標題與一段文字」）" },
          { key: "D", text: "負責自動向伺服器重新發送網路請求並刷新網頁" }
        ],
        answer: "C",
        explain: "<p><strong>HTML（骨架）</strong>：負責定義網頁的結構與內容，告訴瀏覽器網頁裡「有什麼」（標題、圖片、文字段落等）。</p><p><strong>CSS（衣服）</strong>：負責視覺樣式（顏色、圓角、背景漸層）。</p><p><strong>JavaScript（動作）</strong>：負責互動邏輯與動態行為（點擊抽籤、分數累加）。</p><p>(A) 屬 JS　(B) 屬 CSS　(D) 屬網路請求／JS 行為。</p>"
      },
      {
        id: 2,
        type: "觀念辨析",
        title: "標籤、元素與屬性",
        body: "觀察這段程式碼：<div class=\"code-block\">&lt;a href=\"https://example.com\" target=\"_blank\"&gt;點我前往&lt;/a&gt;</div>下列語法結構分析何者正確？",
        options: [
          { key: "A", text: "＜a href=\"...\"＞ 是結束標籤" },
          { key: "B", text: "href 是屬性名稱，「連結網址」是屬性值" },
          { key: "C", text: "「點我前往」是寫在開始標籤內部的屬性內容" },
          { key: "D", text: "此結構屬於沒有文字內容的「空元素 (Empty Element)」" }
        ],
        answer: "B",
        explain: "<p><strong>屬性 (Attribute)</strong> 寫在開始標籤內部，格式為 <code>屬性名稱=\"屬性值\"</code>。此例中 <code>href</code> 是屬性名稱，連結網址是屬性值。</p><p>(A) 錯誤：＜a ...＞ 是<strong>開始標籤</strong>，＜/a＞ 才是結束標籤。</p><p>(C) 錯誤：「點我前往」是夾在開始與結束標籤中間的<strong>文字內容</strong>。</p><p>(D) 錯誤：此元素有文字內容，屬於一般元素；沒有內容也不需要結束標籤的才叫空元素（如 <code>&lt;img&gt;</code>、<code>&lt;br&gt;</code>、<code>&lt;hr&gt;</code>）。</p>"
      },
      {
        id: 3,
        type: "程式碼閱讀與結果預測",
        title: "head 與 body",
        body: "小新寫了以下的 HTML 骨架程式碼，當瀏覽器開啟此檔案時，使用者在<strong>畫面內容區（Canvas）</strong>會看到什麼？<div class=\"code-block\">&lt;!DOCTYPE html&gt;\n&lt;html&gt;\n&lt;head&gt;\n  &lt;meta charset=\"UTF-8\"&gt;\n  &lt;title&gt;小新的個人網站&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;p&gt;歡迎來到我的第一個網頁！&lt;/p&gt;\n&lt;/body&gt;\n&lt;/html&gt;</div>",
        options: [
          { key: "A", text: "網頁分頁標題顯示「歡迎來到我的第一個網頁！」，畫面上顯示「小新的個人網站」" },
          { key: "B", text: "畫面上會同時顯示「歡迎來到我的第一個網頁！」與「這是測試段落」" },
          { key: "C", text: "畫面上只會顯示「歡迎來到我的第一個網頁！」，分頁標題顯示「小新的個人網站」" },
          { key: "D", text: "畫面上會顯示 &lt;title&gt; 與段落文字" }
        ],
        answer: "C",
        explain: "<p><strong>&lt;body&gt;</strong> 區塊：只有寫在 body 內部的內容才會顯示在瀏覽器的主要畫面區。因此畫面上只會出現段落文字「歡迎來到我的第一個網頁！」。</p><p><strong>&lt;head&gt;</strong> 區塊：存放給瀏覽器讀取的設定與元資料。<code>&lt;title&gt;</code> 會顯示在瀏覽器分頁標題列，不會出現在畫面上。</p>"
      },
      {
        id: 4,
        type: "常見錯誤分析",
        title: "巢狀結構 Debug",
        body: "HTML 遵循俄羅斯娃娃般「先開後關」的巢狀 (Nesting) 原則。下列哪一段 HTML 程式碼<strong>存在語法結構錯誤</strong>？",
        options: [
          { key: "A", text: "&lt;p&gt;這是一段 &lt;strong&gt;重要通知&lt;/p&gt;&lt;/strong&gt;" },
          { key: "B", text: "&lt;h2&gt;關於我 &lt;em&gt;新手村民&lt;/em&gt;&lt;/h2&gt;" },
          { key: "C", text: "&lt;p&gt;請點擊 &lt;strong&gt;&lt;em&gt;這裡&lt;/em&gt;&lt;/strong&gt;&lt;/p&gt;" },
          { key: "D", text: "&lt;h1&gt;&lt;span&gt;歡迎光臨&lt;/span&gt;&lt;/h1&gt;" }
        ],
        answer: "A",
        explain: "<p>常見錯誤寫法會是<strong>交叉關閉</strong>，例如：</p><div class=\"code-block\">&lt;p&gt;這是一段 &lt;strong&gt;重要通知&lt;/p&gt;&lt;/strong&gt;</div><p>正確應寫：<code>&lt;p&gt;這是一段 &lt;strong&gt;重要通知&lt;/strong&gt;&lt;/p&gt;</code></p><p>作答時請仔細比對是否有交叉關閉的情況。</p>"
      },
      {
        id: 5,
        type: "觀念題",
        title: "文字編碼與亂碼排查",
        body: "若在瀏覽器開啟網頁時發現網頁中的中文全部變成亂碼（例如變成 <code>å°æ–°</code>），最可能的原因與修正方式為何？",
        options: [
          { key: "A", text: "忘記安裝 Live Server 延伸模組，需要在 VS Code 中重新安裝" },
          { key: "B", text: "＜head＞ 區塊內漏掉了 charset 設定（&lt;meta charset=\"UTF-8\"&gt;）" },
          { key: "C", text: "＜body＞ 內使用了錯誤標籤導致字型解析失敗" },
          { key: "D", text: "檔案副檔名誤設為 .html.txt" }
        ],
        answer: "B",
        explain: "<p>中文亂碼最常見原因是<strong>缺少字元編碼宣告</strong>。</p><p>正確寫法應在 <code>&lt;head&gt;</code> 最前面加上：</p><div class=\"code-block\">&lt;meta charset=\"UTF-8\"&gt;</div><p>讓瀏覽器知道要用 UTF-8 解讀檔案。</p>"
      },
      {
        id: 6,
        type: "程式碼閱讀與結果預測",
        title: "超連結屬性",
        body: "觀察下方 <code>&lt;a&gt;</code> 標籤，當使用者點擊此連結時，瀏覽器會產生何種行為？<div class=\"code-block\">&lt;a href=\"https://github.com\" target=\"_blank\"&gt;我的 GitHub 專頁&lt;/a&gt;</div>",
        options: [
          { key: "A", text: "直接將 GitHub 網頁檔案下載到使用者電腦中" },
          { key: "B", text: "在「當前分頁」直接替換頁面並跳轉至 GitHub 專頁" },
          { key: "C", text: "在「新分頁」開啟 GitHub 專頁，原本的網頁分頁保持開啟" },
          { key: "D", text: "彈出警示視窗提示連結已被鎖定" }
        ],
        answer: "C",
        explain: "<p><code>target=\"_blank\"</code> 的作用是讓連結在<strong>新分頁（或新視窗）</strong>開啟，原本的頁面保持不變。</p><p>若沒有寫 <code>target</code> 或寫 <code>target=\"_self\"</code>，則會在當前分頁直接跳轉。</p>"
      },
      {
        id: 7,
        type: "常見錯誤分析",
        title: "圖片標籤與路徑屬性",
        body: "關於圖片標籤 <code>&lt;img&gt;</code>，下列敘述何者<strong>錯誤</strong>？",
        options: [
          { key: "A", text: "＜img＞ 是空元素，不需要寫結束標籤" },
          { key: "B", text: "src 屬性用來指定圖片檔案的存放路徑或來源" },
          { key: "C", text: "alt 屬性是用來設定圖片在網頁上顯示的像素寬度" },
          { key: "D", text: "若圖片因檔名或路徑錯誤破圖，瀏覽器會顯示 alt 內的替代文字" }
        ],
        answer: "C",
        explain: "<p><code>alt</code> 是「替代文字」（alternative text），當圖片無法顯示時會出現，同時也提供給螢幕閱讀器使用，與寬度無關。</p><p>要設定寬度應使用 <code>width</code> 屬性或 CSS。</p><p>(A)(B)(D) 都正確。</p>"

    let currentIndex = 0;
    let score = 0;
    let answered = Array(questions.length).fill(null);

    const qNumber = document.getElementById("qNumber");
    const qType = document.getElementById("qType");
    const qTitle = document.getElementById("qTitle");
    const qBody = document.getElementById("qBody");
    const optionsEl = document.getElementById("options");
    const feedback = document.getElementById("feedback");
    const feedbackResult = document.getElementById("feedbackResult");
    const feedbackExplain = document.getElementById("feedbackExplain");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const scoreEl = document.getElementById("score");
    const totalEl = document.getElementById("total");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const questionCard = document.getElementById("questionCard");
    const resultScreen = document.getElementById("resultScreen");
    const finalScore = document.getElementById("finalScore");
    const resultEmoji = document.getElementById("resultEmoji");
    const resultTitle = document.getElementById("resultTitle");
    const resultMessage = document.getElementById("resultMessage");
    const restartBtn = document.getElementById("restartBtn");
    const reviewBtn = document.getElementById("reviewBtn");

    totalEl.textContent = questions.length;

    function renderQuestion() {
      const q = questions[currentIndex];
      const state = answered[currentIndex];

      qNumber.textContent = "第 " + q.id + " 題";
      qType.textContent = q.type;
      qTitle.textContent = q.title;
      qBody.innerHTML = q.body;

      optionsEl.innerHTML = "";
      q.options.forEach(function(opt) {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerHTML = '<span class="opt-letter">' + opt.key + '</span><span>' + opt.text + '</span>';

        if (state) {
          btn.disabled = true;
          if (opt.key === q.answer) btn.classList.add("correct");
          if (opt.key === state.selected && !state.correct) btn.classList.add("wrong");
          if (opt.key === state.selected) btn.classList.add("selected");
        } else {
          btn.addEventListener("click", function() {
            selectAnswer(opt.key);
          });
        }

        optionsEl.appendChild(btn);
      });

      if (state) {
        feedback.hidden = false;
        if (state.correct) {
          feedbackResult.className = "feedback-result correct";
          feedbackResult.textContent = "✓ 答對了！";
        } else {
          feedbackResult.className = "feedback-result wrong";
          feedbackResult.textContent = "✗ 答錯了，正確答案是 (" + q.answer + ")";
        }
        feedbackExplain.innerHTML = q.explain;
      } else {
        feedback.hidden = true;
      }

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = !state;
      nextBtn.textContent = currentIndex === questions.length - 1 ? "看結果" : "下一題";

      const progress = ((currentIndex + 1) / questions.length) * 100;
      progressBar.style.setProperty("--progress", progress + "%");
      progressText.textContent = "第 " + (currentIndex + 1) + " / " + questions.length + " 題";
      scoreEl.textContent = score;
    }

    function selectAnswer(key) {
      if (answered[currentIndex]) return;

      const q = questions[currentIndex];
      const correct = key === q.answer;
      answered[currentIndex] = { selected: key, correct: correct };
      if (correct) score++;

      renderQuestion();
    }

    prevBtn.addEventListener("click", function() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    });

    nextBtn.addEventListener("click", function() {
      if (!answered[currentIndex]) return;

      if (currentIndex === questions.length - 1) {
        showResult();
      } else {
        currentIndex++;
        renderQuestion();
      }
    });

    function showResult() {
      questionCard.hidden = true;
      resultScreen.hidden = false;

      finalScore.textContent = score;
      const percent = (score / questions.length) * 100;

      if (percent >= 90) {
        resultEmoji.textContent = "🏆";
        resultTitle.textContent = "太強了！";
        resultMessage.textContent = "幾乎全對，HTML 基礎非常扎實！";
      } else if (percent >= 70) {
        resultEmoji.textContent = "🎉";
        resultTitle.textContent = "表現不錯！";
        resultMessage.textContent = "已經掌握大部分重點，再複習一下錯題就更完美。";
      } else if (percent >= 50) {
        resultEmoji.textContent = "💪";
        resultTitle.textContent = "繼續加油！";
        resultMessage.textContent = "有進步空間，建議把解析再看一次並動手練習。";
      } else {
        resultEmoji.textContent = "📚";
        resultTitle.textContent = "再練一次吧！";
        resultMessage.textContent = "基礎觀念還需要加強，不用灰心，多做幾次就會進步。";
      }
    }

    restartBtn.addEventListener("click", function() {
      currentIndex = 0;
      score = 0;
      answered = Array(questions.length).fill(null);
      questionCard.hidden = false;
      resultScreen.hidden = true;
      renderQuestion();
    });

    reviewBtn.addEventListener("click", function() {
      currentIndex = 0;
      questionCard.hidden = false;
      resultScreen.hidden = true;
      renderQuestion();
    });

    // 啟動
    renderQuestion();
  </script>
</body>
